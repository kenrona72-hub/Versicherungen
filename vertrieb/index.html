<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vertriebs-Cockpit</title>
<style>
  :root{
    --bg:#0f1216; --bg2:#161b22; --bg3:#1c232c; --line:#2a333f;
    --tx:#e7edf3; --tx2:#9aa8b8; --tx3:#6b7a8c;
    --acc:#4f9dff; --acc2:#7c5cff;
    --ok:#2fbf71; --warn:#f0b429; --bad:#f2545b; --cool:#2bb6c4; --wa:#25d366;
    --r:14px;
  }
  html[data-theme="light"]{
    --bg:#f4f6f9; --bg2:#ffffff; --bg3:#eef2f7; --line:#d8e0ea;
    --tx:#131922; --tx2:#4e5c6e; --tx3:#7b8798;
    --acc:#1668d6; --acc2:#6039e8;
    --ok:#177f4d; --warn:#a4700a; --bad:#c22730; --cool:#127d89; --wa:#128c3f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{margin:0 0 .5em;line-height:1.25;font-weight:700}
  h1{font-size:1.55rem} h2{font-size:1.18rem} h3{font-size:1rem} h4{font-size:.9rem}
  p{margin:0 0 .8em}
  code{font-family:ui-monospace,Menlo,monospace;font-size:.85em;background:var(--bg3);padding:1px 5px;border-radius:5px}

  header.top{position:sticky;top:0;z-index:50;background:var(--bg2);border-bottom:1px solid var(--line);padding:10px 16px}
  .topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:1.02rem;cursor:pointer;white-space:nowrap}
  .brand span{color:var(--acc)}
  .crumb{color:var(--tx3);font-size:.9rem}
  .spacer{flex:1}
  main{max-width:1300px;margin:0 auto;padding:18px 16px 90px}
  section.view{display:none} section.view.active{display:block}

  .card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
  .card.tight{padding:12px}
  .grid{display:grid;gap:12px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
  .tile{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:18px;
    cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .1s,border-color .1s;
    display:flex;flex-direction:column;gap:6px;min-height:118px}
  .tile:hover{border-color:var(--acc);transform:translateY(-2px)}
  .tile .ic{font-size:1.7rem;line-height:1}
  .tile .tt{font-weight:700;font-size:1rem}
  .tile .td{font-size:.8rem;color:var(--tx3);line-height:1.4}
  .tile .badge{position:absolute;top:12px;right:12px;background:var(--bad);color:#fff;
    border-radius:99px;font-size:.7rem;font-weight:800;padding:2px 8px}
  .tile.hero{grid-column:1/-1;min-height:auto;border-color:var(--acc);background:linear-gradient(135deg,var(--bg2),var(--bg3))}

  button,.btn{background:var(--bg3);color:var(--tx);border:1px solid var(--line);padding:7px 13px;
    border-radius:9px;cursor:pointer;font:inherit;font-size:.86rem;font-weight:600}
  button:hover{border-color:var(--acc);color:var(--acc)}
  button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
  button.primary:hover{filter:brightness(1.1);color:#fff}
  button.wa{background:var(--wa);color:#fff;border-color:var(--wa)}
  button.wa:hover{filter:brightness(1.08);color:#fff}
  button.sm{padding:4px 9px;font-size:.78rem}
  button.danger:hover{border-color:var(--bad);color:var(--bad)}
  button.back{background:transparent;border-color:transparent;color:var(--tx2);padding:4px 8px}

  input,select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--line);
    border-radius:9px;padding:7px 10px;font:inherit;font-size:.88rem;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
  textarea{resize:vertical;min-height:70px}
  label.f{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);font-weight:700;margin-bottom:4px}
  .field{margin-bottom:10px}

  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:700;white-space:nowrap}
  .t-A{background:rgba(242,84,91,.16);color:var(--bad)}
  .t-B{background:rgba(240,180,41,.16);color:var(--warn)}
  .t-C{background:rgba(107,122,140,.2);color:var(--tx2)}
  .s-Neu{background:rgba(107,122,140,.2);color:var(--tx2)}
  .s-Kontaktiert{background:rgba(43,182,196,.16);color:var(--cool)}
  .s-Termin{background:rgba(79,157,255,.18);color:var(--acc)}
  .s-Analyse{background:rgba(124,92,255,.18);color:var(--acc2)}
  .s-Angebot{background:rgba(240,180,41,.18);color:var(--warn)}
  .s-Abschluss{background:rgba(47,191,113,.18);color:var(--ok)}
  .s-Später{background:rgba(107,122,140,.2);color:var(--tx3)}
  .s-KeinInteresse{background:rgba(242,84,91,.14);color:var(--bad)}

  table{width:100%;border-collapse:collapse;font-size:.86rem}
  th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);
    padding:8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg2);cursor:pointer}
  td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:hover td{background:var(--bg3)}
  .tablewrap{overflow-x:auto;max-height:68vh;overflow-y:auto;border-radius:9px}
  .nm{font-weight:700;cursor:pointer} .nm:hover{color:var(--acc)}
  .sub{font-size:.76rem;color:var(--tx3)}

  .kpi{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .kpi .n{font-size:1.8rem;font-weight:800;line-height:1}
  .kpi .l{font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);font-weight:700;margin-top:6px}
  .bar{height:8px;background:var(--bg3);border-radius:99px;overflow:hidden;margin-top:8px}
  .bar>i{display:block;height:100%;background:var(--acc);border-radius:99px}

  details.acc{border:1px solid var(--line);border-radius:11px;margin-bottom:10px;background:var(--bg2);overflow:hidden}
  details.acc>summary{padding:12px 14px;cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:10px}
  details.acc>summary::-webkit-details-marker{display:none}
  details.acc>summary::before{content:"▸";color:var(--acc)}
  details.acc[open]>summary::before{content:"▾"}
  details.acc>.body{padding:12px 14px 14px;border-top:1px solid var(--line)}

  .script{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:9px;
    padding:12px 14px;margin:8px 0;white-space:pre-wrap;font-size:.88rem;line-height:1.6}
  .hint{font-size:.83rem;color:var(--tx2);background:var(--bg3);border-radius:9px;padding:10px 12px;margin:8px 0}
  .warn{background:rgba(240,180,41,.12);border:1px solid var(--warn);border-radius:9px;padding:10px 13px;margin-bottom:14px;font-size:.87rem}
  ul.tick{list-style:none;padding:0;margin:0}
  ul.tick li{padding:6px 0 6px 24px;position:relative;font-size:.88rem;border-bottom:1px solid var(--line)}
  ul.tick li:last-child{border-bottom:none}
  ul.tick li::before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:800}

  .drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none}
  .drawer-bg.open{display:block}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--bg2);
    border-left:1px solid var(--line);z-index:101;transform:translateX(100%);transition:transform .18s;
    display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .drawer .dh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
  .drawer .db{padding:16px;overflow-y:auto;flex:1}
  .drawer .df{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}

  .chk{display:flex;align-items:center;gap:7px;font-size:.85rem;padding:4px 0}
  .chk input{width:auto;margin:0}
  .item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:none}
  .item .w{flex:1;min-width:0}
  .mini{font-size:.82rem;color:var(--tx2)}
  .overdue{color:var(--bad);font-weight:700}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;
    padding:10px 18px;border-radius:99px;font-weight:700;font-size:.85rem;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  .stepbox{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--bg2);margin-bottom:12px}
  .stepno{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
    background:var(--acc);color:#fff;font-weight:800;font-size:.8rem;margin-right:8px}
  @media print{header.top,.noprint,.tile{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>

<header class="top">
  <div class="topbar">
    <div class="brand" onclick="go('home')">Vertriebs<span>·</span>Cockpit</div>
    <span class="crumb" id="crumb"></span>
    <div class="spacer"></div>
    <button class="sm" onclick="toggleTheme()" title="Hell/Dunkel">◐</button>
    <button class="sm" onclick="go('home')">☰ Start</button>
  </div>
</header>

<main>
  <section class="view active" id="v-home">
    <div id="homeAlert"></div>
    <div class="tiles" id="homeTiles"></div>
  </section>

  <section class="view" id="v-heute">
    <button class="back" onclick="go('home')">← Start</button>
    <h1>Heute</h1>
    <div id="heuteOut"></div>
  </section>

  <section class="view" id="v-kontakte">
    <button class="back" onclick="go('home')">← Start</button>
    <div class="card tight">
      <div class="row">
        <input id="q" placeholder="Suchen…" style="max-width:220px" oninput="renderTable()">
        <select id="fTier" style="max-width:115px" onchange="renderTable()"><option value="">Alle Prio</option><option>A</option><option>B</option><option>C</option></select>
        <select id="fStatus" style="max-width:155px" onchange="renderTable()"></select>
        <select id="fWeek" style="max-width:140px" onchange="renderTable()"></select>
        <select id="fSeg" style="max-width:175px" onchange="renderTable()"></select>
        <div class="spacer"></div>
        <span class="mini" id="cnt"></span>
        <button class="sm primary" onclick="addContact()">+ Kontakt</button>
      </div>
    </div>
    <div class="card tight">
      <div class="tablewrap"><table><thead><tr>
        <th onclick="sortBy('name')">Name</th><th onclick="sortBy('tier')">Prio</th>
        <th onclick="sortBy('week')">W</th><th onclick="sortBy('status')">Status</th>
        <th onclick="sortBy('nextDate')">Nächster Schritt</th><th class="noprint">Aktion</th>
      </tr></thead><tbody id="tbody"></tbody></table></div>
    </div>
  </section>

  <section class="view" id="v-plan">
    <button class="back" onclick="go('home')">← Start</button>
    <div class="card">
      <div class="row">
        <div class="field" style="margin:0"><label class="f">Start (Montag)</label><input type="date" id="startDate" onchange="setStart(this.value)" style="width:170px"></div>
        <div class="spacer"></div>
        <button class="sm" onclick="autoAssign()">Neu verteilen</button>
        <button class="sm" onclick="window.print()">Drucken</button>
      </div>
    </div>
    <div id="planOut"></div>
  </section>

  <section class="view" id="v-rhythmus">
    <button class="back" onclick="go('home')">← Start</button>
    <h1>Wochenrhythmus</h1>
    <p class="mini">Feste Blöcke, jeden Tag gleich. Wenn du nur eins umsetzt, dann das.</p>
    <div id="rhythmOut"></div>
  </section>

  <section class="view" id="v-leitfaden">
    <button class="back" onclick="go('home')">← Start</button>
    <h1>Leitfäden</h1>
    <p class="mini">Wähl die Situation, in der du gerade bist.</p>
    <div class="tiles" id="guideTiles"></div>
  </section>
  <section class="view" id="v-guide">
    <button class="back" onclick="go('leitfaden')">← Leitfäden</button>
    <div id="guideOut"></div>
  </section>

  <section class="view" id="v-daten">
    <button class="back" onclick="go('home')">← Start</button>
    <h1>Datenaufnahme</h1>
    <div id="dataOut"></div>
  </section>

  <section class="view" id="v-ordner">
    <button class="back" onclick="go('home')">← Start</button>
    <h1>Ordner &amp; Ablage</h1>
    <div id="folderOut"></div>
  </section>

  <section class="view" id="v-stats">
    <button class="back" onclick="go('home')">← Start</button>
    <h1>Auswertung</h1>
    <div id="statsOut"></div>
  </section>

  <section class="view" id="v-export">
    <button class="back" onclick="go('home')">← Start</button>
    <h1>Export &amp; Backup</h1>
    <div class="grid g2" id="exportOut"></div>
    <div class="card">
      <h2>Backup einspielen</h2>
      <div class="row">
        <input type="file" id="importFile" accept=".json" style="max-width:320px">
        <button onclick="doImport()">Importieren</button>
        <div class="spacer"></div>
        <button class="danger" onclick="resetAll()">Zurücksetzen</button>
      </div>
    </div>
  </section>
</main>

<div class="drawer-bg" id="dbg" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="dh"><b id="dTitle" style="flex:1;font-size:1.05rem"></b><button class="sm" onclick="closeDrawer()">✕</button></div>
  <div class="db" id="dBody"></div>
  <div class="df">
    <button class="primary" style="flex:1" onclick="saveDrawer()">Speichern</button>
    <button class="danger" onclick="deleteContact()">Löschen</button>
  </div>
</aside>
<div class="toast" id="toast"></div>

<script>
/* ══════════ STAMMDATEN ══════════ */
const STATUS=["Neu","Kontaktiert","Termin","Analyse","Angebot","Abschluss","Später","Kein Interesse"];
const SEGMENTS=["Familie","Enger Freundeskreis","Selbstständig / Firma","Angestellt","Student / Azubi","Sportler","Noch unklar"];
const SPARTEN=["Privathaftpflicht","Hausrat","Rechtsschutz","KFZ","Berufsunfähigkeit","Altersvorsorge","Kranken-Zusatz","Unfall","Wohngebäude","Tierhalterhaftpflicht","Gewerbe / Betrieb","Risikoleben"];
const DATENPUNKTE=["Name + Geburtsdatum","Adresse","Telefon + E-Mail","Familienstand / Partner","Kinder (Anzahl, Alter)",
"Beruf + Arbeitgeber","Netto-Einkommen","Miete oder Eigentum","Bestehende Verträge (Police-Nr.)","Bisherige Gesellschaft(en)",
"Fahrzeug (Typ, SF-Klasse)","Vorschäden 5 Jahre","Hobbys / Risikosport","Gesundheitsfragen relevant?","Ziele 5–10 Jahre",
"IBAN (erst bei Abschluss)","Wer entscheidet mit?"];
const KAPAZITAET=[6,8,10,12,12,12,12,10];

/* Automatik: Status → nächster Schritt + Tage bis Wiedervorlage */
const AUTO={
 "Neu":          ["Erstkontakt schreiben",0],
 "Kontaktiert":  ["Nachfassen – keine Antwort?",4],
 "Termin":       ["Analysegespräch führen",7],
 "Analyse":      ["Auswertung / Angebot vorbereiten",3],
 "Angebot":      ["Angebot nachfassen",4],
 "Abschluss":    ["Unterlagen + Empfehlung fragen",2],
 "Später":       ["Wiedervorlage",42],
 "Kein Interesse":["",null]
};

const WOCHEN=[
 ["Aufwärmen im engsten Kreis","Familie + beste Freunde. Ziel ist Routine, nicht der Abschluss.",["6 Erstkontakte","2 Analysegespräche","Leitfaden 3× laut üben"]],
 ["Erste echte Analysen","Warme Kontakte in Termine bringen. Fehler sind hier billig.",["8 Erstkontakte","4 Analysen","Erste Unterlagen sammeln"]],
 ["Volumen aufbauen","Rhythmus steht, jetzt Menge. Erste Angebote raus.",["10 Erstkontakte","5 Analysen","2 Angebote"]],
 ["Erste Abschlüsse","Nachfassen wird zur Hauptarbeit.",["12 Erstkontakte","6 Analysen","4 Angebote","Ziel: 1–2 Abschlüsse"]],
 ["Empfehlungen starten","Jeder zufriedene Kunde nennt dir 2 Namen. Ab jetzt wächst die Liste von selbst.",["12 Erstkontakte","6 Analysen","Empfehlungsfrage in JEDEM Gespräch"]],
 ["Selbstständige & Firmen","Höhere Beiträge. Diese Woche gehört den Unternehmern.",["12 Erstkontakte","Fokus Gewerbe / BU / Vorsorge","5 Angebote"]],
 ["Nachfassen & Aufräumen","Alles, was liegen geblieben ist.",["12 Erstkontakte","Alle Angebote nachfassen","Doku vollständig"]],
 ["Restliste & Auswertung","Bilanz ziehen, Plan für Monat 3 bauen.",["Restliche Kontakte","Quote je Segment","Neue Liste aus Empfehlungen"]]
];

const RHYTHMUS=[
 ["Montag",[["07:30","Tagesstart: 3 Namen für heute festlegen"],["Vormittag","Schulung"],["17:00–17:45","🔴 Kontaktblock: 3 Erstkontakte"],["18:00–19:00","Termin-Slot"],["21:00","2 Min Doku"]]],
 ["Dienstag",[["Vormittag","Schulung"],["17:00–17:45","🔴 Kontaktblock"],["18:00–20:00","Kundentermin"],["21:00","Doku"]]],
 ["Mittwoch",[["Vormittag","Schulung"],["17:00–17:45","🔴 Kontaktblock + Nachfassen"],["18:00–20:00","Kundentermin"],["21:00","Doku"]]],
 ["Donnerstag",[["Vormittag","Schulung"],["17:00–17:45","🔴 Kontaktblock"],["18:00–20:00","Kundentermin"],["21:00","Doku"]]],
 ["Freitag",[["Vormittag","Schulung"],["16:00–17:00","☎️ Nachfass-Block"],["17:00–18:00","Papierkram + Backup"],["Abend","Frei"]]],
 ["Samstag",[["10:00–13:00","Termin-Fenster (beste Zeit für Berufstätige)"],["14:00","Puffer"],["Rest","Frei"]]],
 ["Sonntag",[["Tagsüber","Frei – ohne schlechtes Gewissen"],["20:00–20:20","📋 Wochenplanung"]]]
];

/* ══════════ NACHRICHTEN ══════════ */
const MSG={
 "Familie":{l:"Familie",t:`Hey [V], alles gut?

Du weißt ja, dass ich jetzt Versicherungen mache. Ich brauch am Anfang ein paar Leute, mit denen ich das mal komplett durchgehen kann.

Hättest du Bock, dass wir uns hinsetzen und deine Verträge zusammen anschauen? Dauert ne halbe Stunde.

Wann passt's dir?`},
 "Enger Freundeskreis":{l:"Enger Freund",t:`Hey [V], alles gut bei dir?

Kurz was Neues: Ich bin jetzt im Versicherungsbereich, erste Prüfung hab ich schon.

Ich geh gerade mit Leuten, die ich kenne, einmal durch, was sie überhaupt an Verträgen haben. Ganz oft zahlt man irgendwo doppelt oder es fehlt was Wichtiges.

30 Minuten, kostet nix. Hättest du diese oder nächste Woche mal Zeit?`},
 "Selbstständig / Firma":{l:"Selbstständig",t:`Hey [V],

kurze Sache: Ich arbeite jetzt im Versicherungsbereich und schau mir gerade gezielt an, wie Selbstständige abgesichert sind. Da ist meistens eine große Lücke – vor allem beim Einkommen.

Ich würd mich gern mal 30 Minuten mit dir hinsetzen und durchgehen, was du hast und was fehlt. Unverbindlich.

Was passt besser: abends unter der Woche oder Samstag vormittag?`},
 "Angestellt":{l:"Angestellt",t:`Hey [V], alles gut?

Ich mach jetzt Versicherungen und geh gerade mit Leuten, die ich kenne, ihre Verträge durch.

Gerade bei Angestellten lohnt sich das – man zahlt oft für Sachen, die der Arbeitgeber eh abdeckt, und was Wichtiges fehlt dafür.

30 Minuten. Hättest du diese oder nächste Woche mal Zeit?`},
 "Student / Azubi":{l:"Student / Azubi",t:`Hey [V], alles gut?

Ich bin jetzt im Versicherungsbereich. Bei Studenten und Azubis ist das meiste zum Glück noch günstig – aber genau deswegen lohnt es sich, es jetzt richtig zu machen statt später teuer.

Sollen wir uns mal 20 Minuten zusammensetzen? Kostet nix.`},
 "Sportler":{l:"Sportler",t:`Hey [V], alles gut?

Ich arbeite jetzt im Versicherungsbereich. Bei dir ist ein Thema besonders wichtig: Was passiert eigentlich, wenn du dich ernsthaft verletzt und länger ausfällst?

Das würd ich gern mal mit dir durchgehen – 30 Minuten, unverbindlich. Wann passt's?`},
 "Noch unklar":{l:"Standard",t:`Hey [V], alles gut bei dir?

Ich mach seit Kurzem was Neues – ich bin jetzt im Versicherungsbereich, erste Prüfung ist bestanden.

Ich geh gerade mit Leuten, die ich kenne, einmal in Ruhe durch, was sie an Verträgen haben. Sehr oft zahlt man irgendwo doppelt oder es fehlt was Wichtiges.

Kostet dich 30 Minuten und sonst nix. Hättest du diese oder nächste Woche mal Zeit?`}
};
const MSG_NACH=`Hey [V], ich weiß du hast viel um die Ohren – wollte nur kurz nachhaken wegen dem Termin.

Sag einfach Bescheid, ob's gerade passt oder ob ich mich in ein paar Wochen nochmal melden soll. 👍`;
const MSG_TERMIN=`Hey [V], freu mich auf [TAG]!

const LS="vertriebscockpit_v1";
let S=null,sortKey="week",sortDir=1,editId=null,view="home";

function load(){
  try{const r=localStorage.getItem(LS); if(r) S=JSON.parse(r);}catch(e){}
  if(!S||!S.contacts){
    S={start:nextMonday(),lastBackup:"",log:{},contacts:SEED.map((r,i)=>({
      id:uid(),name:r[0],rel:r[1],seg:r[2],tier:r[3],week:0,status:"Neu",phone:"",email:"",ort:"",

  }
  S.log=S.log||{}; S.lastBackup=S.lastBackup||"";
  S.contacts.forEach(c=>{c.sparten=c.sparten||[];c.daten=c.daten||[];c.quelle=c.quelle||"Eigene Liste";});
  save();
}
const save=()=>localStorage.setItem(LS,JSON.stringify(S));

/* ══════════ DATUM ══════════ */
function nextMonday(){const d=new Date(),w=d.getDay();d.setDate(d.getDate()+(w===1?7:(8-w)%7||7));return iso(d);}
const iso=d=>d.toISOString().slice(0,10);
const parse=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2]);};
const fmt=s=>s?parse(s).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit"}):"—";
const fmtS=d=>d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});
const todayISO=()=>iso(new Date());
function weekStart(n){const d=parse(S.start);d.setDate(d.getDate()+(n-1)*7);return d;}
function weekEnd(n){const d=weekStart(n);d.setDate(d.getDate()+6);return d;}
function currentWeek(){const t=new Date();t.setHours(0,0,0,0);const diff=Math.floor((t-parse(S.start))/864e5);
  if(diff<0)return 0;const w=Math.floor(diff/7)+1;return w>8?9:w;}
function plusD(n){const d=new Date();d.setDate(d.getDate()+n);return iso(d);}

/* ══════════ AUTOMATIK ══════════ */
function applyAuto(c,st){
  c.status=st;
  const a=AUTO[st]; if(!a)return;
  c.nextAction=a[0];
  c.nextDate=(a[1]===null||a[1]===0)?"":plusD(a[1]);
  if(st!=="Neu")c.lastContact=todayISO();
}
function logToday(){const t=todayISO();S.log[t]=(S.log[t]||0)+1;}
const todayCount=()=>S.log[todayISO()]||0;

function autoAssign(silent){
  const o={A:0,B:1,C:2};
  const list=[...S.contacts].sort((a,b)=>(o[a.tier]-o[b.tier])||(a.ord-b.ord));
  let w=1,left=KAPAZITAET[0];
  for(const c of list){ if(left<=0&&w<8){w++;left=KAPAZITAET[w-1];} c.week=w;left--; }
  save(); if(!silent){renderAll();toast("Wochen neu verteilt");}
}
function setStart(v){S.start=v;save();renderAll();}

function stragglers(){const w=currentWeek();return w<1?[]:S.contacts.filter(c=>c.status==="Neu"&&c.week<w);}
function rollover(){
  const w=currentWeek(),l=stragglers();
  l.forEach(c=>c.week=w>8?8:w);
  save();renderAll();toast(l.length+" Kontakte nachgezogen");
}

function todaysPicks(n){
  const t=todayISO(),w=Math.max(currentWeek(),1);   // vor dem Start schon Welle 1 zeigen
  const due=S.contacts.filter(c=>c.nextDate&&c.nextDate<=t&&["Neu","Kontaktiert","Später"].includes(c.status))
    .sort((a,b)=>a.nextDate.localeCompare(b.nextDate));
  const wave=S.contacts.filter(c=>c.status==="Neu"&&c.week===w).sort((a,b)=>({A:0,B:1,C:2}[a.tier]-{A:0,B:1,C:2}[b.tier]));
  const rest=S.contacts.filter(c=>c.status==="Neu"&&c.week<w);
  const out=[],seen=new Set();
  for(const c of due.concat(wave,rest)){ if(!seen.has(c.id)){seen.add(c.id);out.push(c);} if(out.length>=n)break; }
  return out;
}

/* ══════════ WHATSAPP / TELEFON ══════════ */
function waNum(p){
  let d=(p||"").replace(/[^\d+]/g,"");
  if(!d)return "";
  if(d.charAt(0)==="+")d=d.slice(1);
  else if(d.slice(0,2)==="00")d=d.slice(2);
  else if(d.charAt(0)==="0")d="49"+d.slice(1);
  return d;
}
function msgFor(c,kind){
  const v=(c.name||"").trim().split(" ")[0];
  let t;
  if(kind==="nach")t=MSG_NACH;
  else if(kind==="termin")t=MSG_TERMIN;
  else if(kind==="danke")t=MSG_DANKE;
  else t=(MSG[c.seg]||MSG["Noch unklar"]).t;
  return t.replace(/\[V\]/g,v).replace(/\[TAG\]/g,c.nextDate?fmt(c.nextDate):"unseren Termin");
}
function sendWA(id,kind){
  const c=S.contacts.find(x=>x.id===id); if(!c)return;
  const n=waNum(c.phone),txt=encodeURIComponent(msgFor(c,kind));
  window.open(n?"https://wa.me/"+n+"?text="+txt:"https://wa.me/?text="+txt,"_blank");
  if(c.status==="Neu"){applyAuto(c,"Kontaktiert");logToday();save();renderAll();toast("→ Status: Kontaktiert");}
}
function callNow(id){
  const c=S.contacts.find(x=>x.id===id);
  if(!c||!c.phone){toast("Keine Nummer hinterlegt");return;}
  window.location.href="tel:"+c.phone.replace(/[^\d+]/g,"");
}
function copyMsg(id,kind){
  const c=S.contacts.find(x=>x.id===id);
  navigator.clipboard.writeText(msgFor(c,kind)).then(()=>toast("Nachricht kopiert"));
}
function setStatus(id,st){
  const c=S.contacts.find(x=>x.id===id); if(!c)return;
  const wasNew=c.status==="Neu";
  applyAuto(c,st);
  if(wasNew&&st!=="Neu")logToday();
  save();renderAll();toast(c.name+" → "+st);
}

function sortBy(k){if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1;}renderTable();}
function filtered(){
  const g=id=>document.getElementById(id).value;
  const q=(g("q")||"").toLowerCase(),ti=g("fTier"),st=g("fStatus"),wk=g("fWeek"),sg=g("fSeg");
  return S.contacts.filter(c=>
    (!ti||c.tier===ti)&&(!st||c.status===st)&&(!wk||String(c.week)===wk)&&(!sg||c.seg===sg)&&
    (!q||(c.name+" "+c.rel+" "+c.notes+" "+c.ort).toLowerCase().indexOf(q)>=0)
  ).sort((a,b)=>{
    let x=a[sortKey],y=b[sortKey];
    if(sortKey==="tier"){const o={A:0,B:1,C:2};x=o[x];y=o[y];}
    if(x==null)x="";if(y==null)y="";
    return (x>y?1:x<y?-1:0)*sortDir;
  });
}

    ${["Kontaktiert","Termin","Analyse","Angebot","Abschluss"].map(s=>{
      const i=STATUS.indexOf(s);
      const n=c.filter(x=>{const j=STATUS.indexOf(x.status);return j>=i&&j<=5;}).length;
      return `<div style="margin-bottom:8px"><div class="row" style="font-size:.84rem"><b>${s}</b><div class="spacer"></div>
        <span class="mini">${n} · ${pct(n,ang)} der Angesprochenen</span></div>
        <div class="bar"><i style="width:${ang?n/ang*100:0}%"></i></div></div>`;}).join("")}
  </div>
  <div class="card"><h2>Quote je Segment</h2>
    <div class="tablewrap"><table><thead><tr><th>Segment</th><th>Gesamt</th><th>Angespr.</th><th>Termine+</th><th>Abschl.</th><th>Quote</th></tr></thead>
    <tbody>${bySeg}</tbody></table></div>
    <p class="mini" style="margin-top:10px">Das Segment mit der besten Quote sagt dir, wo du in Monat 3 suchen solltest.</p></div>
  <div class="card"><h2>Aktivität letzte 14 Tage</h2>
    ${days.length?`<div class="row" style="align-items:flex-end;gap:6px;height:95px">`+
      days.map(d=>`<div style="flex:1;text-align:center">
        <div style="background:var(--acc);border-radius:4px 4px 0 0;height:${Math.min(S.log[d]*18,70)}px" title="${d}: ${S.log[d]}"></div>
        <div class="sub" style="font-size:.65rem">${d.slice(8)}.</div></div>`).join("")+`</div>`
      :`<p class="mini">Noch keine Aktivität erfasst. Sobald du Kontakte anschreibst, entsteht hier deine Kurve.</p>`}
  </div>`;
}

/* ---- Export ---- */
function renderExport(){
  document.getElementById("exportOut").innerHTML=`
  <div class="card"><h3>💾 Vollbackup (.json)</h3>

  <div class="card"><h3>📅 Kalender (.ics)</h3>

    <button class="primary" onclick="dl('vertrieb.ics',buildICS())">⬇️ .ics laden</button></div>
  <div class="card"><h3>📝 Obsidian (.md)</h3>

function doBackup(){
  dl("cockpit-backup-"+todayISO()+".json",JSON.stringify(S,null,2));
  S.lastBackup=todayISO();save();renderAll();
}

/* ---- Generatoren ---- */
const pad=n=>String(n).padStart(2,"0");
const icsDate=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
const icsLocal=(d,h,m)=>icsDate(d)+"T"+pad(h)+pad(m)+"00";
const icsStamp=()=>new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
const ical=s=>String(s).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");
function fold(line){
  const bl=t=>new TextEncoder().encode(t).length;
  if(bl(line)<=73)return line;
  const out=[];let cur="",n=0;
  for(const ch of line){const c=bl(ch);if(n+c>73){out.push(cur);cur=" ";n=1;}cur+=ch;n+=c;}
  out.push(cur);return out.join("\r\n");
}
function evDay(id,start,title,desc,al){
  const e=new Date(start);e.setDate(e.getDate()+1);
  const L=["BEGIN:VEVENT","UID:"+id+"@cockpit","DTSTAMP:"+icsStamp(),
    "DTSTART;VALUE=DATE:"+icsDate(start),"DTEND;VALUE=DATE:"+icsDate(e),"SUMMARY:"+ical(title)];
  if(desc)L.push("DESCRIPTION:"+ical(desc));
  if(al)L.push("BEGIN:VALARM","TRIGGER;RELATED=START:"+al,"ACTION:DISPLAY","DESCRIPTION:"+ical(title),"END:VALARM");
  L.push("END:VEVENT");return L.map(fold).join("\r\n");
}
function evTime(id,day,h,mi,dur,title,desc,al){
  const L=["BEGIN:VEVENT","UID:"+id+"@cockpit","DTSTAMP:"+icsStamp(),"DTSTART:"+icsLocal(day,h,mi)];
  const t=h*60+mi+dur;L.push("DTEND:"+icsLocal(day,Math.floor(t/60)%24,t%60));
  L.push("SUMMARY:"+ical(title));
  if(desc)L.push("DESCRIPTION:"+ical(desc));
  if(al!=null)L.push("BEGIN:VALARM","TRIGGER:-PT"+al+"M","ACTION:DISPLAY","DESCRIPTION:"+ical(title),"END:VALARM");
  L.push("END:VEVENT");return L.map(fold).join("\r\n");
}
function buildICS(){
  const o=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Vertriebs-Cockpit//DE","CALSCALE:GREGORIAN","X-WR-CALNAME:Vertrieb"];
  for(let n=1;n<=8;n++){
    const s=weekStart(n),r=WOCHEN[n-1],l=S.contacts.filter(c=>c.week===n);
    o.push(evDay("w"+n,s,"Woche "+n+": "+r[0],
      r[1]+"\n\nZiele:\n- "+r[2].join("\n- ")+"\n\nKontakte:\n- "+l.map(c=>c.name+(c.rel?" ("+c.rel+")":"")).join("\n- "),"PT8H"));
    const so=new Date(s);so.setDate(so.getDate()-1);
    o.push(evTime("p"+n,so,20,0,20,"Wochenplanung W"+n,"Welle "+n+" ansehen, Termine blocken, Backup ziehen.\n\nSchwerpunkt: "+r[0],15));
    for(let d=0;d<4;d++){const day=weekStart(n);day.setDate(day.getDate()+d);
      o.push(evTime("kb"+n+"-"+d,day,17,0,45,"Kontaktblock – 3 Erstkontakte","Cockpit öffnen, Tab Heute. Die 3 Namen stehen schon da.",10));}
    const fr=weekStart(n);fr.setDate(fr.getDate()+4);
    o.push(evTime("nf"+n,fr,16,0,60,"Nachfass-Block + Backup","Offene Angebote durchgehen, danach JSON-Backup ziehen.",10));
  }
  S.contacts.filter(c=>c.nextDate).forEach((c,i)=>
    o.push(evTime("c"+i+"-"+c.id,parse(c.nextDate),9,0,30,c.name+": "+(c.nextAction||"Nächster Schritt"),
      "Prio "+c.tier+" · "+c.seg+(c.rel?" · "+c.rel:"")+(c.phone?"\nTel: "+c.phone:"")+"\n\n"+(c.notes||""),0)));
  o.push("END:VCALENDAR");return o.join("\r\n");
}
function buildMD(){
  const L=["---","typ: plan","erstellt: "+todayISO(),"start: "+S.start,"tags: [vertrieb, plan]","---","",
    "# Vertriebsplan – 8 Wochen","","Start **"+fmt(S.start)+"** · Ende **"+fmt(iso(weekEnd(8)))+"** · "+S.contacts.length+" Kontakte",""];
  L.push("## Wochenrhythmus","");
  RHYTHMUS.forEach(d=>{L.push("### "+d[0]);d[1].forEach(b=>L.push("- **"+b[0]+"** – "+b[1]));L.push("");});
  L.push("## Die 8 Wellen","");
  for(let n=1;n<=8;n++){
    const r=WOCHEN[n-1];
    L.push("### Woche "+n+" · "+r[0],"*"+fmtS(weekStart(n))+" – "+fmtS(weekEnd(n))+"*","","> "+r[1],"","**Ziele**");
    r[2].forEach(f=>L.push("- [ ] "+f));
    L.push("","**Kontakte**");
    S.contacts.filter(c=>c.week===n).forEach(c=>L.push("- [ ] [["+c.name+"]] — Prio "+c.tier+(c.rel?" · "+c.rel:"")+" · "+c.status));
    L.push("");
  }
  L.push("## Kennzahlen","","| Woche | Erstkontakte | Termine | Analysen | Angebote | Abschlüsse |","|---|---|---|---|---|---|");
  for(let n=1;n<=8;n++)L.push("| "+n+" |  |  |  |  |  |");
  return L.join("\n");
}
function buildCSV(){
  const h=["Name","Beziehung","Prio","Segment","Woche","Status","Telefon","EMail","Ort","NaechsterSchritt","Datum","LetzterKontakt","Quelle","Sparten","Notizen"];
  const rows=S.contacts.map(c=>[c.name,c.rel,c.tier,c.seg,"W"+c.week,c.status,c.phone,c.email,c.ort,
    c.nextAction,c.nextDate,c.lastContact,c.quelle,c.sparten.join(" | "),(c.notes||"").replace(/\n/g," ")]);
  return "\uFEFF"+[h].concat(rows).map(r=>r.map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(";")).join("\n");
}
function buildVCF(){
  return S.contacts.map(c=>{
    const L=["BEGIN:VCARD","VERSION:3.0","FN:"+c.name,"N:;"+c.name+";;;"];
    if(c.phone)L.push("TEL;TYPE=CELL:"+c.phone);
    if(c.email)L.push("EMAIL:"+c.email);
    L.push("CATEGORIES:Vertrieb,Prio-"+c.tier,"NOTE:"+ical((c.rel||c.seg)+" · W"+c.week+" · "+c.status),"END:VCARD");
    return L.join("\r\n");
  }).join("\r\n");
}
const q=s=>'"'+String(s==null?"":s).replace(/"/g,'\\"')+'"';
function buildScript(){
  const L=["#!/bin/bash","# Kunden-Ordner + Obsidian-Notizen · erzeugt am "+todayISO(),"set -e","",
  'ICLOUD="$HOME/Library/Mobile Documents/com~apple~CloudDocs/Versicherung/Kunden"',
  'VAULT="$HOME/Obsidian/Versicherung"           # <-- ggf. anpassen',
  'LOCAL="$HOME/Versicherung"',"",
  'mkdir -p "$ICLOUD" "$VAULT/Kunden" "$VAULT/Wissen"',
  '[ -e "$LOCAL" ] || ln -s "$ICLOUD/.." "$LOCAL"',"",
  'SUB=("01_Stammdaten" "02_Bestandsvertraege" "03_Analyse" "04_Angebote" "05_Antraege_Policen" "06_Schriftverkehr" "07_Schadenfaelle")',"",
  "mk(){",'  d="$ICLOUD/$1"','  for s in "${SUB[@]}"; do mkdir -p "$d/$s"; done',
  '  if [ ! -f "$d/README.md" ]; then',
  '    printf "# %s\\n\\n- Beziehung: %s\\n- Priorität: %s\\n- Segment: %s\\n- Kontaktwoche: %s\\n- Status: %s\\n\\n## Gesprächshistorie\\n\\n" "$2" "$3" "$4" "$5" "$6" "$7" > "$d/README.md"',
  "  fi",'  n="$VAULT/Kunden/$2.md"','  if [ ! -f "$n" ]; then','    { echo "---";',
  '      echo "typ: kunde";','      echo "name: \\"$2\\"";','      echo "beziehung: \\"$3\\"";','      echo "prio: $4";',
  '      echo "segment: \\"$5\\"";','      echo "woche: $6";','      echo "status: $7";','      echo "ordner: \\"$d\\"";',
  '      echo "tags: [kunde, prio-$4]";','      echo "---"; echo "";','      echo "# $2"; echo "";',
  '      echo "## Kontaktdaten"; echo "- Telefon: "; echo "- E-Mail: "; echo "";',
  '      echo "## Situation"; echo "- Familienstand: "; echo "- Beruf: "; echo "- Wohnsituation: "; echo "";',
  '      echo "## Bestehende Verträge"; echo "";','      echo "## Bedarf / Lücken"; echo "";',
  '      echo "## Gesprächsnotizen"; echo "";','      echo "## Nächster Schritt"; echo "- [ ] Erstkontakt";',
  '    } > "$n"',"  fi",'  echo "  ok  $2"',"}","",'echo "Lege an: $ICLOUD"',""];
  S.contacts.forEach(c=>L.push("mk "+q(slug(c.name))+" "+q(c.name)+" "+q(c.rel)+" "+q(c.tier)+" "+q(c.seg)+" "+q("W"+c.week)+" "+q(c.status)));
  L.push("",'echo ""','echo "Fertig. '+S.contacts.length+' Kundenordner + Notizen."','echo "iCloud : $ICLOUD"','echo "Vault  : $VAULT/Kunden"');
  return L.join("\n");
}
function copyNote(id){
  const c=S.contacts.find(x=>x.id===id);
  const L=["---","typ: kunde",'name: "'+c.name+'"','beziehung: "'+c.rel+'"',"prio: "+c.tier,'segment: "'+c.seg+'"',
    "woche: "+c.week,"status: "+c.status,'naechster_schritt: "'+c.nextAction+'"',"termin: "+(c.nextDate||""),
    'quelle: "'+c.quelle+'"',"tags: [kunde, prio-"+c.tier+"]","---","","# "+c.name,"",
    "## Kontaktdaten","- Telefon: "+c.phone,"- E-Mail: "+c.email,"- Ort: "+c.ort,"",
    "## Bedarf / Lücken"].concat(c.sparten.map(s=>"- [ ] "+s),[""],
    ["## Datenaufnahme"],DATENPUNKTE.map(d=>"- ["+(c.daten.indexOf(d)>=0?"x":" ")+"] "+d),[""],
    ["## Gesprächsnotizen",c.notes||"","","## Nächster Schritt","- [ ] "+c.nextAction+(c.nextDate?" 📅 "+c.nextDate:"")]);
  navigator.clipboard.writeText(L.join("\n")).then(()=>toast("Notiz kopiert"));
}

/* ---- Utils ---- */
function dl(name,content){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([content],{type:"text/plain;charset=utf-8"}));
  a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast(name+" geladen");
}
function doImport(){
  const f=document.getElementById("importFile").files[0];
  if(!f){toast("Keine Datei gewählt");return;}
  const r=new FileReader();
  r.onload=function(){try{const d=JSON.parse(r.result);if(!d.contacts)throw 0;S=d;load();renderAll();go("home");toast("Backup eingespielt");}
    catch(e){alert("Datei konnte nicht gelesen werden.");}};
  r.readAsText(f);
}
function resetAll(){
  if(!confirm("Wirklich alles zurücksetzen?"))return;
  if(!confirm("Sicher? Mach vorher ein Backup."))return;
  localStorage.removeItem(LS);S=null;load();renderAll();go("home");toast("Zurückgesetzt");
}
function cp(btn){navigator.clipboard.writeText(btn.previousElementSibling.textContent).then(()=>toast("Kopiert"));}
const esc=s=>String(s==null?"":s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
const at=s=>String(s==null?"":s).replace(/"/g,"&quot;");
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1800);}
function toggleTheme(){const h=document.documentElement;
  const n=h.getAttribute("data-theme")==="light"?"dark":"light";
  h.setAttribute("data-theme",n);localStorage.setItem("cockpit_theme",n);}

/* ---- Init ---- */
document.documentElement.setAttribute("data-theme",localStorage.getItem("cockpit_theme")||
  (window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"));
load();renderAll();go("home");
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});
</script>
